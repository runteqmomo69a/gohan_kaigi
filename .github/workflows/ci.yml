name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-setup:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: myapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myapp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:password@localhost:5432/myapp_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend assets
        run: |
          yarn build
          yarn build:css

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run RSpec
        env:
          CI: true
        run: bundle exec rspec

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

      - name: Add coverage summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            ruby -rjson -e 'data = JSON.parse(File.read("coverage/.last_run.json")); puts "## Coverage"; puts; puts "- Line Coverage: #{data.dig("result", "line")}%"' >> "$GITHUB_STEP_SUMMARY"
          fi
